name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Install Workshop
        uses: canonical/launch-workshop@v1

      - name: Run tests
        run: workshop run dev -- test
