name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Run tests (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - stable
          - nightly
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}

      - name: Install Workshop
        uses: ./.github/actions/install-workshop

      - name: Install tools
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Run tests
        run: mise run test
        timeout-minutes: 5
