---
base: lua51

globals:
  assert:
    any: true
  vim:
    any: true
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  before_each:
    args:
      - type: function
  after_each:
    args:
      - type: function
  setup:
    args:
      - type: function
  teardown:
    args:
      - type: function
  pending:
    args:
      - type: string
        required: false
